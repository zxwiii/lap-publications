name: Weekly WoS Publications Auto-Sync

on:
  schedule:
    # Runs at 00:00 UTC (08:00 AM Beijing Time) every Monday
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install openpyxl

      - name: Run WoS Sync Engine
        env:
          WOS_API_KEY: ${{ secrets.WOS_API_KEY || 'a5650a3cf00489bdd8d41011a3eca36de7c668de' }}
        run: |
          python sync_wos.py

      - name: Commit and Push Changes to GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add publications_data.js crossref_cache.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-sync publications from Web of Science [$(date +'%Y-%m-%d')]" && git push)

      - name: Mirror and Sync to Gitee
        env:
          GITEE_USER: ${{ secrets.GITEE_USER }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_REPO: ${{ secrets.GITEE_REPO || 'lap-publications' }}
        run: |
          if [ -n "$GITEE_TOKEN" ] && [ -n "$GITEE_USER" ]; then
            echo "Syncing repository to Gitee ($GITEE_USER/$GITEE_REPO)..."
            git push --force "https://${GITEE_USER}:${GITEE_TOKEN}@gitee.com/${GITEE_USER}/${GITEE_REPO}.git" HEAD:master
            echo "Successfully mirrored to Gitee!"
          else
            echo "Notice: GITEE_USER or GITEE_TOKEN secret not set in GitHub. Skipping Gitee push."
          fi
